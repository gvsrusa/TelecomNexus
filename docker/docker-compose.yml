services:
  mongo:
    image: mongo:8
    container_name: telecom-nexus-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_DATABASE: telecom_nexus
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cassandra:
    image: cassandra:5
    container_name: telecom-nexus-cassandra
    ports:
      - "9042:9042"
    volumes:
      - ./data/cassandra:/var/lib/cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: TelecomCluster
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  cassandra-init:
    image: cassandra:5
    container_name: telecom-nexus-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-init:/scripts
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      SCRIPT_DIR: /scripts
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
