name: E2E Tests

on:
  push:
    branches: [master, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      cassandra:
        image: cassandra:5
        ports:
          - 9042:9042
        env:
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 128M
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize Cassandra schema
        run: |
          until cqlsh localhost 9042 -e "DESCRIBE KEYSPACES" 2>/dev/null; do
            echo "Waiting for Cassandra..."
            sleep 5
          done
          cqlsh localhost 9042 -f docker/cassandra-init/01-schema.cql

      - name: Build all packages
        run: npx turbo run build

      - name: Seed databases
        run: npx turbo run seed

      - name: Start backend services
        run: |
          cd apps/services/customer-service && npx tsx src/index.ts &
          cd apps/services/network-service && npx tsx src/index.ts &
          cd apps/services/billing-service && npx tsx src/index.ts &
          cd apps/gateway && npx tsx src/index.ts &
          sleep 10

      - name: Start Shell app
        run: |
          cd apps/shell && npm run start &
          sleep 10

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
