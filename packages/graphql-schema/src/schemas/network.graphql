extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.0"
    import: ["@key", "@shareable"]
  )

type Query {
  devices(region: String, status: DeviceStatus): [NetworkDevice!]!
  device(deviceId: ID!): NetworkDevice
  telemetry(deviceId: ID!, timeRange: TimeRange!): [TelemetryReading!]!
  alerts(deviceId: ID, severity: AlertSeverity, status: AlertStatus): [Alert!]!
  alertsSummary: AlertsSummary!
}

type Mutation {
  acknowledgeAlert(alertId: ID!): Alert!
  resolveAlert(alertId: ID!, resolution: String!): Alert!
}

type Subscription {
  newAlert(region: String): Alert!
  telemetryUpdate(deviceId: ID!): TelemetryReading!
}

type NetworkDevice @key(fields: "deviceId") {
  deviceId: ID!
  type: DeviceType!
  name: String!
  location: GeoLocation!
  status: DeviceStatus!
  connectedDevices: [NetworkDevice!]!
  metadata: DeviceMetadata!
  configXml: String
}

type GeoLocation {
  lat: Float!
  lng: Float!
  address: String!
  region: String!
}

type DeviceMetadata {
  manufacturer: String!
  model: String!
  firmwareVersion: String!
  installDate: DateTime!
}

type TelemetryReading {
  deviceId: ID!
  timestamp: DateTime!
  cpuPercent: Float!
  memoryPercent: Float!
  bandwidthMbps: Float!
  packetLossPercent: Float!
  temperatureCelsius: Float!
}

type Alert {
  alertId: ID!
  device: NetworkDevice!
  severity: AlertSeverity!
  title: String!
  description: String!
  status: AlertStatus!
  timestamp: DateTime!
  resolvedAt: DateTime
}

type AlertsSummary {
  critical: Int!
  major: Int!
  minor: Int!
  info: Int!
  total: Int!
}

input TimeRange {
  start: DateTime!
  end: DateTime!
  granularity: Granularity
}

enum DeviceType {
  TOWER
  SWITCH
  ROUTER
  BASE_STATION
  FIBER_NODE
}

enum DeviceStatus {
  OPERATIONAL
  DEGRADED
  DOWN
  MAINTENANCE
}

enum AlertSeverity {
  CRITICAL
  MAJOR
  MINOR
  INFO
}

enum AlertStatus {
  ACTIVE
  ACKNOWLEDGED
  RESOLVED
}

enum Granularity {
  MINUTE
  FIVE_MINUTES
  HOUR
  DAY
}
