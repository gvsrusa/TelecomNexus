mutation ChangePlan($customerId: ID!, $planCode: String!) {
  changePlan(customerId: $customerId, planCode: $planCode) {
    success
    customer {
      customerId
      activePlan {
        planCode
      }
    }
  }
}

mutation CreateTicket($input: CreateTicketInput!) {
  createTicket(input: $input) {
    ticketId
    status
  }
}

mutation AddTicketMessage($ticketId: ID!, $content: String!) {
  addTicketMessage(ticketId: $ticketId, content: $content) {
    ticketId
    messages {
      content
      timestamp
    }
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateCustomerProfile(input: $input) {
    customerId
    firstName
    lastName
  }
}
