query GetInvoice($invoiceNumber: String!) {
  invoice(invoiceNumber: $invoiceNumber) {
    ...InvoiceFields
  }
}

query GetInvoices($customerId: ID!, $status: InvoiceStatus, $limit: Int) {
  customer(customerId: $customerId) {
    customerId
    invoices(status: $status, limit: $limit) {
      ...InvoiceFields
    }
  }
}
