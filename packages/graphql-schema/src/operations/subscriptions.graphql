subscription OnTicketUpdated($customerId: ID!) {
  ticketUpdated(customerId: $customerId) {
    ticketId
    status
    messages {
      content
      timestamp
    }
  }
}

subscription OnNewAlert($region: String) {
  newAlert(region: $region) {
    alertId
    severity
    title
    timestamp
  }
}

subscription OnTelemetryUpdate($deviceId: ID!) {
  telemetryUpdate(deviceId: $deviceId) {
    deviceId
    timestamp
    cpuPercent
    bandwidthMbps
  }
}
